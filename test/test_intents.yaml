uk-ua:
  check-service-status.intent:
  # чи (блютуз|bluetooth|ейр плей|airplay|спотіфай|spotify|кей ді і|kde|к.д.е.|kde connect|к.д.е. коннект) (увімкнено|ввімкнено|активовано|вимкнено|деактивовано)
    - чи блютуз увімкнено
    - чи bluetooth активовано
    - чи ейрплей ввімкнено
    - чи airplay вимкнено
    - чи спотіфай деактивовано
    - чи spotify увімкнено
    - чи кей ді і активовано
    - чи к.д.е. коннект вимкнено
    - чи kde connect увімкнено
  disable-airplay.intent:
  # вимкнути ейрплей/вимкнути airplay/деактивувати ейрплей/деактивувати airplay
    - вимкнути ейрплей
    - вимкнути airplay
    - деактивувати ейрплей
    - деактивувати airplay
  disable-bluetooth.intent:
  # вимкнути блютуз/вимкнути bluetooth/деактивувати блютуз/деактивувати bluetooth
    - вимкнути блютуз
    - вимкнути bluetooth
    - деактивувати блютуз
    - деактивувати bluetooth
  disable-kde-connect.intent:
  # вимкнути (кей ді і коннект|кде коннект|к.д.е. коннект|kde connect)/деактивувати (кей ді і коннект|кде коннект|к.д.е. коннект|kde connect)
    - вимкнути кей ді і коннект
    - вимкнути кде коннект
    - вимкнути к.д.е. коннект
    - вимкнути kde connect
    - деактивувати кей ді і коннект
    - деактивувати кде коннект
  disable-spotify.intent:
  # вимкнути спотіфай/вимкнути spotify/деактивувати спотіфай/деактивувати spotify
    - вимкнути спотіфай
    - вимкнути spotify
    - деактивувати спотіфай
    - деактивувати spotify
  enable-airplay.intent:
  # увімкнути ейрплей/увімкнути airplay/активувати ейрплей/активувати airplay
    - увімкнути ейрплей
    - увімкнути airplay
    - активувати ейрплей
    - активувати airplay
  enable-bluetooth.intent:
  # увімкнути блютуз/увімкнути bluetooth/активувати блютуз/активувати bluetooth
    - увімкнути блютуз
    - увімкнути bluetooth
    - активувати блютуз
    - активувати bluetooth
  enable-kde-connect.intent:
  # увімкнути (кей ді і коннект|кде коннект|к.д.е. коннект|kde connect)/активувати (кей ді і коннект|кде коннект|к.д.е. коннект|kde connect)
    - увімкнути кей ді і коннект
    - увімкнути кде коннект
    - увімкнути к.д.е. коннект
    - активувати кей ді і коннект
    - активувати кде коннект
  enable-spotify.intent:
  # увімкнути спотіфай/увімкнути spotify/активувати спотіфай/активувати spotify
    - увімкнути спотіфай
    - увімкнути spotify
    - активувати спотіфай
    - активувати spotify
  pair-bluetooth.intent:
  # з'єднати (з|до) блютуз/з'єднати (з|до) bluetooth/спарувати блютуз/спарувати bluetooth
    - з'єднати з блютуз
    - з'єднати до bluetooth
    - спарувати блютуз
    - спарувати bluetooth
  pair-kde-connect.intent:
  # з'єднати (з|до) (кей ді і коннект|кде коннект|к.д.е. коннект|kde connect)/спарувати (кей ді і коннект|кде коннект|к.д.е. коннект|kde connect)
    - з'єднати з кей ді і коннект
    - з'єднати до кде коннект
    - з'єднати з к.д.е. коннект
    - з'єднати до kde connect
    - спарувати кей ді і коннект
    - спарувати кде коннект
  rename-airplay.intent:
  # перейменувати (|мій )пристрій ейрплей/перейменувати (|мій )пристрій airplay
    - перейменувати пристрій ейрплей
    - перейменувати мій пристрій ейрплей
    - перейменувати пристрій airplay
    - перейменувати мій пристрій airplay
  rename-spotify.intent:
  # перейменувати (|мій )пристрій спотіфай/перейменувати (|мій )пристрій spotify
    - перейменувати пристрій спотіфай
    - перейменувати мій пристрій спотіфай
    - перейменувати пристрій spotify
    - перейменувати мій пристрій spotify